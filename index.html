<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOX Watches</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: #fff;
}

header {
    background: black;
    padding: 20px;
    text-align: center;
    border-bottom: 2px solid gold;
}

header h1 {
    margin: 0;
    color: gold;
    letter-spacing: 3px;
}

nav {
    display: flex;
    justify-content: center;
    background: #111;
}

nav a {
    color: white;
    padding: 15px 20px;
    text-decoration: none;
}

nav a:hover {
    color: gold;
}

.hero {
    height: 400px;
    background: url('https://images.unsplash.com/photo-1524592094714-0f0654e20314') center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2.5em;
    font-weight: bold;
    text-shadow: 0 0 10px black;
}

.container {
    padding: 40px;
    text-align: center;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.product {
    background: #111;
    border: 1px solid gold;
    border-radius: 10px;
    padding: 20px;
    transition: 0.3s;
}

.product:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px gold;
}

.product img {
    width: 100%;
    border-radius: 10px;
}

.product h3 {
    color: gold;
}

.price {
    font-size: 1.2em;
    margin: 10px 0;
}

button {
    padding: 10px 15px;
    border: none;
    background: gold;
    color: black;
    cursor: pointer;
    border-radius: 5px;
    font-weight: bold;
}

button:hover {
    background: #ffd700;
}

footer {
    background: black;
    text-align: center;
    padding: 20px;
    border-top: 2px solid gold;
    margin-top: 40px;
}

/* simple click animation */
button:active {
    transform: scale(0.95);
}
</style>
</head>

<body>

<header>
    <h1>KNOX</h1>
    <p>Precision Meets Power</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Collection</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<div class="hero">
    Luxury Redefined
</div>

<div class="container">
    <h2>Featured Collection</h2>

    <div class="products">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3">
            <h3>KNOX Silver Core</h3>
            <p class="price">$199</p>
            <button onclick="alert('Added to cart!')">Buy Now</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1547996160-81dfa63595aa">
            <h3>KNOX Gold Elite</h3>
            <p class="price">$349</p>
            <button onclick="alert('Added to cart!')">Buy Now</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1508057198894-247b23fe5ade">
            <h3>KNOX Black Phantom</h3>
            <p class="price">$279</p>
            <button onclick="alert('Added to cart!')">Buy Now</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b">
            <h3>KNOX Chrono X</h3>
            <p class="price">$399</p>
            <button onclick="alert('Added to cart!')">Buy Now</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1596464716127-f2a82984de30">
            <h3>KNOX Steel Sport</h3>
            <p class="price">$229</p>
            <button onclick="alert('Added to cart!')">Buy Now</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
            <h3>KNOX Midnight Pro</h3>
            <p class="price">$319</p>
            <button onclick="alert('Added to cart!')">Buy Now</button>
        </div>

    </div>
</div>

<footer>
    <p>© 2026 KNOX Watches — Built for Time. Designed for Power.</p>
</footer>

</body>
</html>
