<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOX Watches</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: #fff;
}

header {
    background: black;
    padding: 20px;
    text-align: center;
    border-bottom: 2px solid gold;
}

header h1 {
    color: gold;
    letter-spacing: 3px;
}

nav {
    display: flex;
    justify-content: space-between;
    padding: 10px 20px;
    background: #111;
}

nav .links a {
    color: white;
    margin: 0 10px;
    text-decoration: none;
}

nav .links a:hover {
    color: gold;
}

.cart {
    color: gold;
    font-weight: bold;
}

.hero {
    height: 350px;
    background: url('https://images.unsplash.com/photo-1524592094714-0f0654e20314') center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2em;
    font-weight: bold;
}

.container {
    padding: 40px;
    text-align: center;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.product {
    background: #111;
    border: 1px solid gold;
    border-radius: 10px;
    padding: 20px;
    transition: 0.3s;
}

.product:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px gold;
}

.product img {
    width: 100%;
    border-radius: 10px;
}

.product h3 {
    color: gold;
}

.price {
    margin: 10px 0;
}

button {
    padding: 10px;
    background: gold;
    border: none;
    cursor: pointer;
    font-weight: bold;
    border-radius: 5px;
}

button:hover {
    background: #ffd700;
}

.cart-box {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: black;
    border: 1px solid gold;
    padding: 20px;
    width: 250px;
    display: none;
}

footer {
    text-align: center;
    padding: 20px;
    border-top: 2px solid gold;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
    <h1>KNOX</h1>
    <p>Precision Meets Power</p>
</header>

<nav>
    <div class="links">
        <a href="#">Home</a>
        <a href="#">Collection</a>
        <a href="#">Contact</a>
    </div>
    <div class="cart" onclick="toggleCart()">
        🛒 Cart (<span id="cart-count">0</span>)
    </div>
</nav>

<div class="hero">
    Luxury Redefined
</div>

<div class="container">
    <h2>Collection</h2>

    <div class="products">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3">
            <h3>Silver Core</h3>
            <p class="price">$199</p>
            <button onclick="addToCart(199)">Buy</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1547996160-81dfa63595aa">
            <h3>Gold Elite</h3>
            <p class="price">$349</p>
            <button onclick="addToCart(349)">Buy</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1508057198894-247b23fe5ade">
            <h3>Black Phantom</h3>
            <p class="price">$279</p>
            <button onclick="addToCart(279)">Buy</button>
        </div>

    </div>
</div>

<div class="cart-box" id="cart-box">
    <h3>Your Cart</h3>
    <p>Items: <span id="items">0</span></p>
    <p>Total: $<span id="total">0</span></p>
    <button onclick="checkout()">Checkout</button>
</div>

<footer>
    <p>© 2026 KNOX Watches</p>
</footer>

<script>
let count = 0;
let total = 0;

function addToCart(price) {
    count++;
    total += price;

    document.getElementById("cart-count").innerText = count;
    document.getElementById("items").innerText = count;
    document.getElementById("total").innerText = total;

    alert("Added to cart!");
}

function toggleCart() {
    let box = document.getElementById("cart-box");
    box.style.display = box.style.display === "block" ? "none" : "block";
}

function checkout() {
    alert("Checkout coming soon 💳");
}
</script>

</body>
</html>
