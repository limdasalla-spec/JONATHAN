<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeless Watches</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #333;
    }

    header {
        background: #111;
        color: white;
        padding: 20px;
        text-align: center;
    }

    nav {
        background: #222;
        display: flex;
        justify-content: center;
    }

    nav a {
        color: white;
        padding: 15px 20px;
        text-decoration: none;
    }

    nav a:hover {
        background: #444;
    }

    .hero {
        background: url('https://images.unsplash.com/photo-1519744346363-d5c59d0bce68') no-repeat center/cover;
        height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 2em;
        font-weight: bold;
    }

    .container {
        padding: 40px;
        text-align: center;
    }

    .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }

    .product {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .product img {
        width: 100%;
        border-radius: 10px;
    }

    .product h3 {
        margin: 10px 0;
    }

    .product button {
        padding: 10px 15px;
        background: #111;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }

    .product button:hover {
        background: #333;
    }

    footer {
        background: #111;
        color: white;
        text-align: center;
        padding: 20px;
        margin-top: 40px;
    }
</style>
</head>
<body>

<header>
    <h1>Timeless Watches</h1>
    <p>Luxury. Precision. Style.</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<div class="hero">
    Discover Your Perfect Watch
</div>

<div class="container">
    <h2>Featured Watches</h2>

    <div class="products">
        <div class="product">
            <img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3" alt="Watch 1">
            <h3>Classic Silver</h3>
            <p>$199</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b" alt="Watch 2">
            <h3>Luxury Gold</h3>
            <p>$299</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1508057198894-247b23fe5ade" alt="Watch 3">
            <h3>Modern Black</h3>
            <p>$249</p>
            <button>Buy Now</button>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2026 Timeless Watches. All rights reserved.</p>
</footer>

</body>
</html>
